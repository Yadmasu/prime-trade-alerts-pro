name: Prime scanner checks
on:
  pull_request:
    paths:
      - scanner.py
      - tests/**
      - .github/workflows/prime-checks.yml
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scanner.py
      - run: python -m pip install aiohttp==3.12.15
      - run: python -m unittest discover -s tests -v
