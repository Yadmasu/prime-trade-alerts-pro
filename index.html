<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOYO TRADE PRO</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080c10;
color:#fff;
font-family:Arial,sans-serif;
}

header{
text-align:center;
padding:25px;
background:#10161d;
border-bottom:1px solid #293744;
}

.logo{
font-size:30px;
font-weight:900;
}

.logo span{color:#d5ff35}

.sub{
color:#91a2af;
font-size:12px;
margin-top:8px;
}

main{
max-width:1100px;
margin:auto;
padding:15px;
}

.card{
background:#111820;
border:1px solid #293744;
border-radius:15px;
padding:17px;
margin-bottom:16px;
}

h2{
font-size:19px;
margin-top:0;
}

label{
display:block;
color:#a7b5c2;
font-size:13px;
margin:12px 0 6px;
}

select,input{
width:100%;
padding:13px;
border-radius:9px;
border:1px solid #354451;
background:#0a1016;
color:#fff;
font-size:15px;
}

button{
background:#18232d;
color:#fff;
border:1px solid #354451;
padding:12px;
border-radius:9px;
font-weight:bold;
cursor:pointer;
}

button.active,.analyze{
background:#d5ff35;
color:#080c10;
border-color:#d5ff35;
}

.row{
display:flex;
gap:7px;
overflow-x:auto;
margin:14px 0;
}

.row button{min-width:55px}

#chart{
height:580px;
width:100%;
}

.note{
color:#9aaab6;
font-size:12px;
line-height:1.6;
}

.analyze{
width:100%;
padding:17px;
font-size:17px;
margin-top:15px;
}

.result{
margin-top:15px;
background:#0b1218;
padding:15px;
border-radius:10px;
line-height:1.8;
}

.badge{
color:#d5ff35;
font-size:12px;
}

footer{
text-align:center;
color:#758594;
padding:25px;
font-size:12px;
}
</style>
</head>

<body>

<header>
<div class="logo">YOYO <span>TRADE</span></div>
<div class="sub">PROFESSIONAL MARKET ANALYSIS</div>
</header>

<main>

<section class="card">

<h2>Market Explorer</h2>

<label>Market Category</label>

<select id="category" onchange="changeCategory()">
<option value="crypto">Crypto</option>
<option value="stocks">Stocks</option>
<option value="etfs">ETFs</option>
